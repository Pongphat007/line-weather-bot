services:
  - type: web
    name: line-weather-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "20"
